<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>크루레이블 — 풀버전 영상 · 크루 합류 방법</title>
<meta name="description" content="크루레이블(Crew Label) 풀버전 영상과 크루 합류 방법을 한곳에서 확인하세요.">
<meta property="og:title" content="크루레이블 — 풀버전 영상 · 크루 합류 방법">
<meta property="og:description" content="팀 안에서 캐릭터를 쌓는 유튜브 팟캐스트 크루">
<meta property="og:image" content="https://crewlabel-rec.github.io/images/crew%20label%20logo.png">
<style>
@font-face {
  font-family: 'GMarketSans';
  src: url('https://crewlabel-rec.github.io/font/GMARKETSANSTTFMEDIUM.TTF') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0a;
  --card: #151515;
  --line: rgba(255,255,255,0.10);
  --text: #ffffff;
  --text-sub: rgba(255,255,255,0.70);
  --mint: #a8f0d0;
  --mint-ink: #0a5c3a;
  --gold: #f2d27a;      /* 방송인 = 무명백서 도장 계열 골드 */
  --gold-ink: #4a3410;
}
html, body { background: var(--bg); }
body {
  font-family: 'GMarketSans', -apple-system, BlinkMacSystemFont, 'Pretendard', 'Noto Sans KR', sans-serif;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; }

/* ── HERO ── */
.hero {
  text-align: center;
  padding: 8px 8px 14px;
  background: radial-gradient(120% 80% at 50% 0%, rgba(168,240,208,0.14) 0%, rgba(168,240,208,0) 60%);
  border-radius: 16px;
  margin-bottom: 14px;
}
.logo { width: 300px; max-width: 86%; display: block; margin: -18px auto -10px; }
/* ── ABOUT (채널 링크 아래 소개 한 줄) ── */
.about { text-align: center; margin-top: 22px; font-size: clamp(13px, 3.6vw, 14px); color: var(--text-sub); line-height: 1.6; word-break: keep-all; }
.about em { font-style: normal; color: var(--mint); }

/* ── GROUP CARD ── */
.group {
  background: var(--card);
  border: 0.5px solid var(--line);
  border-radius: 16px;
  padding: 18px 14px 14px;
  margin-bottom: 12px;
}
.group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.head-ico { width: 44px; height: 44px; border-radius: 12px; background: rgba(168,240,208,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.head-ico svg { width: 26px; height: 26px; stroke: var(--mint); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.who-big { font-size: clamp(17px, 5vw, 19px); font-weight: 500; line-height: 1.3; margin-bottom: 3px; }
.who-big em { font-style: normal; color: var(--mint); }
.who { font-size: clamp(12px, 3.5vw, 14px); color: var(--text-sub); word-break: keep-all; line-height: 1.4; }

/* ── BUTTONS ── */
.btn {
  display: block; text-decoration: none;
  border-radius: 12px;
  padding: 14px 14px;
  min-height: 52px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.btn:active { transform: scale(0.98); opacity: 0.9; }
.btn + .btn { margin-top: 8px; }
.btn-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: clamp(15px, 4.4vw, 17px); font-weight: 500; line-height: 1.4; word-break: keep-all; text-wrap: balance; }
.btn-label::after { content: '→'; font-size: 0.95em; flex-shrink: 0; }
.btn-desc { display: block; margin-top: 6px; font-size: clamp(12px, 3.5vw, 13px); line-height: 1.45; word-break: keep-all; text-wrap: balance; }

.btn.primary { background: var(--mint); color: var(--mint-ink); container-type: inline-size; }
/* 풀버전 버튼 제목: 휴대폰 폭에 맞춰 글자 크기가 자동으로 조절되며 항상 한 줄 유지 (최대 17px) */
.btn-title { display: block; white-space: nowrap; font-weight: 500; line-height: 1.35; }
/* 두 제목 중 더 긴 쪽(일반인)에 맞춘 같은 비율 → 일반인·방송인 글자 크기가 항상 같음 */
.fit { font-size: 14px; font-size: min(17px, 5.37cqw); }
.btn.primary .btn-desc { display: flex; align-items: center; justify-content: space-between; text-wrap: wrap; }
.btn.primary .btn-desc::after { content: '→'; font-size: clamp(15px, 4.4vw, 17px); }
.btn.primary .btn-desc { color: rgba(10,92,58,0.85); }
.btn.secondary { background: transparent; color: var(--mint); border: 1px solid rgba(168,240,208,0.55); padding: 15px 14px 13px; }
.btn-label .lbl { display: flex; align-items: center; gap: 8px; }
.ji { width: 21px; height: 21px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ── 방송인 카드 = 골드 ── */
.group.gold { border-color: rgba(242,210,122,0.25); }
.group.gold .head-ico { background: rgba(242,210,122,0.14); }
.group.gold .head-ico svg { stroke: var(--gold); }
.group.gold .who-big em { color: var(--gold); }
.group.gold .btn.primary { background: var(--gold); color: var(--gold-ink); }
.group.gold .btn.primary .btn-desc { color: rgba(74,52,16,0.85); }
.group.gold .btn.secondary { color: var(--gold); border-color: rgba(242,210,122,0.6); }

/* ── CHANNEL ── */
/* 풀버전·합류 버튼보다 한 단계 낮은 강조(회색 버튼), 같은 화살표로 누를 수 있음을 표시 */
.channel {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-top: 4px;
  padding: 14px 16px; min-height: 52px;
  border-radius: 12px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.22);
  color: var(--text); text-decoration: none;
  font-size: clamp(15px, 4.2vw, 16px); font-weight: 500;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.08s ease, opacity 0.15s ease;
}
.channel .ico { width: 20px; height: 20px; flex-shrink: 0; display: block; }
.channel:active { transform: scale(0.98); opacity: 0.85; }
</style>
</head>
<body>
<main class="wrap">

  <!-- HERO -->
  <header class="hero">
    <img class="logo" src="https://crewlabel-rec.github.io/images/crew%20label%20logo%20white%20text.png" alt="크루레이블 로고">
  </header>

  <!-- 일반인 -->
  <section class="group" aria-label="일반인">
    <div class="group-head">
      <span class="head-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.2"/><path d="M8.5 7V5.6A1.6 1.6 0 0 1 10.1 4h3.8a1.6 1.6 0 0 1 1.6 1.6V7"/><path d="M3 12.5h18"/></svg></span>
      <div><div class="who-big">나는 <em>일반인</em>이에요</div><div class="who">직장인·자영업자·사업가·대학생 등</div></div>
    </div>
    <a class="btn primary" href="https://youtu.be/xqZqJNcSQBA">
      <span class="btn-title fit">평범한 내가 리스크 없이 방송인이 되는 법</span>
      <span class="btn-desc">🎬 풀버전 영상 보기</span>
    </a>
    <a class="btn secondary" href="https://crewlabel-rec.github.io/tiktok-people/">
      <span class="btn-label"><span class="lbl"><svg class="ji" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.6"/><path d="M2.8 20c0-3.5 2.8-6.2 6.2-6.2s6.2 2.7 6.2 6.2"/><path d="M19 7.5v6M16 10.5h6"/></svg>크루 합류 방법</span></span>
    </a>
  </section>

  <!-- 방송인 -->
  <section class="group gold" aria-label="방송인">
    <div class="group-head">
      <span class="head-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21M8.5 21h7"/></svg></span>
      <div><div class="who-big">나는 <em>방송인</em>이에요</div><div class="who">연기자·아나운서·개그맨·성우 등</div></div>
    </div>
    <a class="btn primary" href="https://youtu.be/tmsjUKxpjPg">
      <span class="btn-title fit">무명 방송인이 캐릭터를 쌓아야 하는 이유</span>
      <span class="btn-desc">🎬 풀버전 영상 보기</span>
    </a>
    <a class="btn secondary" href="https://crewlabel-rec.github.io/tiktok-broadcaster/">
      <span class="btn-label"><span class="lbl"><svg class="ji" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.6"/><path d="M2.8 20c0-3.5 2.8-6.2 6.2-6.2s6.2 2.7 6.2 6.2"/><path d="M19 7.5v6M16 10.5h6"/></svg>크루 합류 방법</span></span>
    </a>
  </section>

  <!-- 채널 -->
  <a class="channel" href="https://www.youtube.com/@crewlabel">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.9"/>
      <path d="M10 8.3v7.4c0 .45.5.72.88.47l5.6-3.7a.56.56 0 0 0 0-.94l-5.6-3.7A.56.56 0 0 0 10 8.3z" fill="#a8f0d0"/>
    </svg>
    <span>크루레이블 유튜브 채널</span>
  </a>

  <!-- 맨 아래까지 내려온(아직 망설이는) 사람을 위한 한 줄 -->
  <p class="about">방송 경험이 없어도, 오디션 준비 중이어도<br><em>주 1회 녹화</em>로 함께할 수 있어요</p>

</main>
</body>
</html>
